    html=html.replace('asOf:"Week 1 starter lineup snapshot"','asOf:"Updated Sep 10 after Thursday night"');

    html=html.replace('badge:"Kevin vs Kevin"','badge:"JSN delivered · Maye melted · Puka answered"');
    html=html.replace('leaders:"<b>B. Nix</b> 17.9 · <b>JSN</b> 16.3 · <b>N. Collins</b> 14.5"','leaders:"<strong>IN THE BOOKS:</strong> <b>JSN</b> 8 rec · 122 yds · TD · <b>B. Nix</b> 17.9 proj"');
    html=html.replace('leaders:"<b>D. Maye</b> 19.7 · <b>Nacua</b> 17.1 · <b>Egbuka</b> 13.8"','leaders:"<strong>IN THE BOOKS:</strong> <b>D. Maye</b> 178 pass · TD · 3 INT · <b>Puka</b> played in LA\'s 7 point dud"');
    html=html.replace('football:"Larmon owns the cleaner projection and the deeper starter profile. Simpson can absolutely make this uncomfortable because Maye and Puka carry the two biggest individual numbers in his lineup, but his running backs are asking a lot more questions than they are answering."','football:"Two games are now in the books for this matchup. JSN detonated for 8 catches, 122 yards, and a touchdown for Larmon. Drake Maye answered with 178 passing yards and a touchdown for Simpson, but three fourth quarter interceptions wrecked the finish. Then Puka had to work inside a Rams offense that managed only seven points in a 27 to 7 loss. Simpson has already burned two of his biggest starter bullets while Larmon still has most of the lineup waiting."');
    html=html.replace('roast:"Simpson\'s roster currently looks like <b>Maye and Puka wearing a trench coat pretending to be a complete fantasy team.</b> Larmon does not need a miracle here. He mostly needs his starters to avoid collectively stepping on a rake. If Simpson wins, the group chat is going to hear about it until at least Thanksgiving, because an 11 point underdog named Kevin beating the other Kevin is exactly the kind of stupid league history nobody ever lets die."','roast:"Simpson opened Week 1 by getting <b>three fourth quarter interceptions from Maye and then sending Puka into an offense that scored seven damn points in Australia.</b> Meanwhile JSN went 8 for 122 and a touchdown for Larmon. Simpson is not dead, but two of the guys who were supposed to carry the rescue mission have already clocked out. The rest of that lineup better bring jumper cables."');
    html=html.replace('verdict:"Touchdown Syndrome. Simpson needs his stars to hit the ceiling and somebody in that RB room to discover violence."','verdict:"Advantage Touchdown Syndrome. JSN landed the cleanest punch and Simpson has already used Maye and Puka without getting the explosion he needed."');

    html=html.replace('football:"Mikey has the highest team projection on the board and a ridiculous top end with Burrow and McCaffrey. Zach is not far behind because Dart, Chase Brown, Kenneth Walker, Nabers, and Pickens give Dirty Money legitimate ceiling. This matchup has more actual firepower than most of the slate."','football:"Mikey got his first starter into the books Thursday with Christian McCaffrey, but San Francisco did not need to ride him hard in a 27 to 7 demolition of the Rams. The 49ers ground game was led by Kaelon Black, so CMC did not deliver the kind of opening haymaker Mikey would have loved. Zach still has his entire starting lineup waiting, which keeps this one very much alive despite Mikey entering the week with the stronger projection."');
    html=html.replace('roast:"This is the matchup where both managers get to feel smart until Sunday afternoon and then one of them starts blaming a coordinator he has never met. Mikey built a lineup with enough horsepower to run through the league. Zach built one with enough volatility to either score 140 or make him stare silently at his phone while everybody asks if he is okay. <b>There will be no middle ground.</b>"','roast:"Mikey sent Christian McCaffrey to Australia expecting a fantasy Crocodile Dundee moment and instead watched <b>Kaelon Black lead San Francisco in rushing while CMC got the veteran workload treatment.</b> The 49ers won by twenty, which is wonderful unless you are Mikey staring at fantasy points wondering why the ass kicking did not involve his guy more. Zach has not fired a starter yet, so the panic button remains under glass."');
    html=html.replace('verdict:"Mang The Stallion. Best projected lineup of Week 1, but Dirty Money has enough weapons to turn this into a bar fight."','verdict:"Still Mang The Stallion, but Thursday did not give Mikey the CMC head start he wanted. Dirty Money gets to answer with a full chamber on Sunday."');

    html=html.replace('football:"Jake has the better full lineup projection and a sturdy base with Daniels, Jonathan Taylor, Garrett Wilson, and Drake London. Jack has two massive ceiling plays in Caleb and Bijan plus Kyren, so the underdog path is obvious. The problem is what happens after the stars."','football:"Jack now has four starters in the books across the first two games. Rhamondre Stevenson gave him useful volume Wednesday, while A.J. Brown left hurt and Hunter Henry stayed quiet. Thursday finally delivered a touchdown when Kyren Williams punched in the Rams’ only score from five yards out. The bad news is Jack also started the Rams defense while San Francisco hung 27 on them. Jake still has nearly his entire lineup waiting."');
    html=html.replace('roast:"Jack has Caleb and Bijan bringing a flamethrower to the matchup, then Ja\'Kobi Lane shows up with a 2.4 projection carrying <b>a damp book of matches.</b> That one starting slot is the fantasy equivalent of leaving a window open during a house fire. Jake should win this. Which, naturally, means Jake now has the much funnier way to lose it."','roast:"Jack finally found the end zone Thursday thanks to Kyren, then immediately had to watch <b>his own Rams defense get dragged around Australia for 27 points.</b> That is fantasy football efficiency: score points with one starter while another starter stands directly across the field trying to give them back. Jake has barely started playing and Jack already has enough receipts for a CVS aisle."');
    html=html.replace('verdict:"Sues canyon. Jack has enough top end juice to make Jake sweat, but the lineup gets thin in a hurry."','verdict:"Still Sues canyon. Kyren gave Jack life, but the Rams defense made sure Thursday was not allowed to feel too good."');

    html=html.replace('football:"Calder has the biggest single starter projection of the week in Josh Allen and another strong number in James Cook. The issue is the drop after that. Adam is more balanced with Mahomes, Gibbs, Rashee Rice, Trey McBride, and several respectable starter projections behind them."','football:"Adam’s Patriots defense is locked in after holding Seattle to 13 points and 285 total yards, but New England forced zero turnovers and still lost after Drew Lock finished the comeback. It is a respectable defensive floor rather than a week winning eruption. Calder still has Josh Allen and James Cook waiting, so Adam’s original balance advantage remains the bigger story."');
    html=html.replace('roast:"Calder\'s lineup is basically Josh Allen and James Cook dragging <b>a couch up three flights of stairs while everybody else says they are helping.</b> Adam does not need to be spectacular. He just needs his roster to behave like nine professional football players. If Calder steals this, Adam deserves every reaction emoji the Trash Talk board can physically display."','roast:"Adam started the Patriots defense and got the weirdest possible fantasy appetizer: <b>hold the opponent to 13, force absolutely zero turnovers, then lose to the backup quarterback anyway.</b> Not a disaster, not a flex, just aggressively beige defense. Calder’s Josh Allen shaped sledgehammer is still sitting on the table waiting for Sunday."');
    html=html.replace('verdict:"GRIZZLY ADAMZ. This is the week\'s projected ass kicking unless Allen personally decides otherwise."','verdict:"GRIZZLY ADAMZ still has the edge, but New England’s defense did not deliver the knockout. Allen still has a path to make this stupid."');

    html=html.replace('football:"Four tenths separate these teams, so the projection model is essentially shrugging. Ron has the Dak, Achane, Lamb core. Tommy answers with Lawrence, Javonte, Breece, Chase, and a receiver room with enough depth to make one random touchdown swing the whole thing."','football:"The projection started as a coin flip, and Ron got the first meaningful edge from Seattle’s defense. The Seahawks allowed only 10 points, sacked Drake Maye three times, and intercepted him three times in the fourth quarter. That is exactly the kind of defensive result that matters in a matchup separated by four tenths before kickoff. Tommy now needs his skill players to erase an early defensive punch."');
    html=html.replace('roast:"This matchup is so close that one meaningless fourth quarter catch could decide which grown man spends Monday acting like he solved football. Ron and Tommy have both been given the fantasy equivalent of a loaded coin. Whoever loses is going to stare at one starter on the bench and convince himself he knew better all along. <b>There is no graceful way to lose a 0.4 point spread.</b>"','roast:"Ron walked into a matchup separated by four tenths and immediately got <b>three sacks, three picks, and ten points allowed</b> from Seattle’s defense. Tommy has not even unpacked his Sunday lineup yet and Ron is already standing in the doorway asking whether he needs help carrying the scoreboard. If Tommy loses close, those three Maye interceptions are going to haunt him despite belonging to a completely different Kevin."');
    html=html.replace('verdict:"Pure toss up. Tommy by the width of a stat correction and absolutely no confidence."','verdict:"Lean Mandys Magic after the Seattle defense landed the first clean shot. Still close enough for Sunday to ruin everybody’s confidence."');
