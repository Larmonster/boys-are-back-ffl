    html=html.replace('leaders:"<b>B. Nix</b> 17.9 · <b>JSN</b> 16.3 · <b>N. Collins</b> 14.5"','leaders:"<strong>IN THE BOOKS:</strong> <b>JSN</b> 8 rec · 122 yds · TD · <b>B. Nix</b> 17.9 proj"');

    html=html.replace('football:"Larmon owns the cleaner projection and the deeper starter profile. Simpson can absolutely make this uncomfortable because Maye and Puka carry the two biggest individual numbers in his lineup, but his running backs are asking a lot more questions than they are answering."','football:"Opening night landed the first real punch in this matchup. JSN detonated for 8 catches, 122 yards, and a touchdown for Larmon. Drake Maye answered with 178 passing yards and a touchdown for Simpson, but three fourth quarter interceptions turned what could have been a strong opener into a fantasy gut punch. Puka and the rest of Simpson’s starters still have time to answer, but Larmon banked the cleaner result."');
    html=html.replace('roast:"Simpson\'s roster currently looks like <b>Maye and Puka wearing a trench coat pretending to be a complete fantasy team.</b> Larmon does not need a miracle here. He mostly needs his starters to avoid collectively stepping on a rake. If Simpson wins, the group chat is going to hear about it until at least Thanksgiving, because an 11 point underdog named Kevin beating the other Kevin is exactly the kind of stupid league history nobody ever lets die."','roast:"Simpson needed Maye to come out swinging and instead got <b>three fourth quarter interceptions and a live television demonstration of how to set a fantasy projection on fire.</b> Meanwhile JSN went 8 for 122 and a touchdown for Larmon. That is a brutal first night of Kevin vs Kevin. Simpson is not dead yet, but Puka may want to start stretching now because he just inherited a rescue mission."');
    html=html.replace('verdict:"Touchdown Syndrome. Simpson needs his stars to hit the ceiling and somebody in that RB room to discover violence."','verdict:"Advantage Touchdown Syndrome after night one. JSN delivered the goods while Maye spent the fourth quarter handing Seattle receipts."');

    html=html.replace('football:"Jake has the better full lineup projection and a sturdy base with Daniels, Jonathan Taylor, Garrett Wilson, and Drake London. Jack has two massive ceiling plays in Caleb and Bijan plus Kyren, so the underdog path is obvious. The problem is what happens after the stars."','football:"Jake still has the cleaner projection, but Jack already has three starters in the books from New England’s opener. Rhamondre Stevenson handled 18 carries for 51 yards and added 5 catches for 44 more, giving Jack a useful volume floor. A.J. Brown finished with 3 catches for 26 yards before leaving with an ankle injury, while Hunter Henry added 3 for 26. None of the three found the end zone, so Jack got activity without the kind of explosion an underdog really wanted."');
    html=html.replace('roast:"Jack has Caleb and Bijan bringing a flamethrower to the matchup, then Ja\'Kobi Lane shows up with a 2.4 projection carrying <b>a damp book of matches.</b> That one starting slot is the fantasy equivalent of leaving a window open during a house fire. Jake should win this. Which, naturally, means Jake now has the much funnier way to lose it."','roast:"Jack threw <b>three separate starters</b> into the season opener and somehow came away without a single touchdown from any of them. Stevenson at least did grown man work. A.J. Brown left hurt, Hunter Henry mostly existed, and Jack now gets to spend the rest of Week 1 staring at three completed stat lines while Jake still has almost his entire firing squad loaded."');
    html=html.replace('verdict:"Sues canyon. Jack has enough top end juice to make Jake sweat, but the lineup gets thin in a hurry."','verdict:"Still Sues canyon, but Stevenson kept Jack from face planting on opening night. Brown’s ankle is the ugly receipt."');

    html=html.replace('football:"Calder has the biggest single starter projection of the week in Josh Allen and another strong number in James Cook. The issue is the drop after that. Adam is more balanced with Mahomes, Gibbs, Rashee Rice, Trey McBride, and several respectable starter projections behind them."','football:"Adam’s Patriots defense is now locked in after holding Seattle to 13 points and 285 total yards, but New England forced zero turnovers and still lost after Drew Lock finished the comeback. It is a respectable defensive floor rather than a week winning eruption. Calder still has Josh Allen and James Cook waiting, so Adam’s original balance advantage remains the bigger story."');
    html=html.replace('roast:"Calder\'s lineup is basically Josh Allen and James Cook dragging <b>a couch up three flights of stairs while everybody else says they are helping.</b> Adam does not need to be spectacular. He just needs his roster to behave like nine professional football players. If Calder steals this, Adam deserves every reaction emoji the Trash Talk board can physically display."','roast:"Adam started the Patriots defense and got the weirdest possible fantasy appetizer: <b>hold the opponent to 13, force absolutely zero turnovers, then lose to the backup quarterback anyway.</b> Not a disaster, not a flex, just aggressively beige defense. Calder’s Josh Allen shaped sledgehammer is still sitting on the table waiting for Sunday."');
    html=html.replace('verdict:"GRIZZLY ADAMZ. This is the week\'s projected ass kicking unless Allen personally decides otherwise."','verdict:"GRIZZLY ADAMZ still has the edge, but New England’s defense did not deliver the knockout. Allen still has a path to make this stupid."');

    html=html.replace('football:"Four tenths separate these teams, so the projection model is essentially shrugging. Ron has the Dak, Achane, Lamb core. Tommy answers with Lawrence, Javonte, Breece, Chase, and a receiver room with enough depth to make one random touchdown swing the whole thing."','football:"The projection started as a coin flip, and Ron got the first meaningful edge from Seattle’s defense. The Seahawks allowed only 10 points, sacked Drake Maye three times, and intercepted him three times in the fourth quarter. That is exactly the kind of defensive result that matters in a matchup separated by four tenths before kickoff. Tommy now needs his skill players to erase an early defensive punch."');
    html=html.replace('roast:"This matchup is so close that one meaningless fourth quarter catch could decide which grown man spends Monday acting like he solved football. Ron and Tommy have both been given the fantasy equivalent of a loaded coin. Whoever loses is going to stare at one starter on the bench and convince himself he knew better all along. <b>There is no graceful way to lose a 0.4 point spread.</b>"','roast:"Ron walked into a matchup separated by four tenths and immediately got <b>three sacks, three picks, and ten points allowed</b> from Seattle’s defense. Tommy has not even unpacked his Sunday lineup yet and Ron is already standing in the doorway asking whether he needs help carrying the scoreboard. If Tommy loses close, those three Maye interceptions are going to haunt him despite belonging to a completely different Kevin."');
