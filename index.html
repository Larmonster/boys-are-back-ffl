<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boys Are Back HQ</title>
<style>html,body{margin:0;min-height:100%;background:#070D1A;color:#F7F4EC;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase}</style>
</head>
<body>
<div class="loading">Loading league HQ...</div>
<script>
(async function(){
  try{
    let html = await fetch('hq-source.html?v=20260908').then(r => { if(!r.ok) throw new Error('HQ source unavailable'); return r.text(); });
    const archiveBtn = '<button class="tab-btn" data-tab="archive" role="tab" aria-selected="false">Archive</button>';
    const trashNav = '<a class="tab-btn" href="trash-talk.html" style="text-decoration:none;display:inline-flex;align-items:center;">Trash Talk</a>';
    html = html.replace(archiveBtn, archiveBtn + '\n      ' + trashNav);
    const standingsBtn = '<button class="cta" data-goto="standings">Check Standings</button>';
    const trashCta = '<a class="cta" href="trash-talk.html" style="text-decoration:none;display:inline-flex;align-items:center;">Enter Trash Talk</a>';
    html = html.replace(standingsBtn, standingsBtn + '\n            ' + trashCta);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div>HQ failed to load. <a style="color:#FB4F14" href="hq-source.html">Open HQ</a> &nbsp; <a style="color:#FB4F14" href="trash-talk.html">Trash Talk</a></div></div>';
  }
})();
</script>
</body>
</html>
